name: Encrypted database backup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = configuration only; backup = export/upload; verify = read/decrypt/catalog check"
        type: choice
        options: [check, backup, verify]
        default: check
        required: true
      object_key:
        description: "Existing backup object key for verify (not a URL; leave empty for check/backup)"
        type: string
        required: false
  schedule:
    # UTC: 04:17/05:17 Kyiv, after the reputation settlement. Not an exact-time SLA.
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: votebot-database-backup
  cancel-in-progress: false

jobs:
  backup:
    # Schedules are opt-in; manually run "check" first, then an approved backup.
    if: github.event_name == 'workflow_dispatch' || vars.BACKUPS_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check external tools
        if: github.event_name == 'schedule' || inputs.mode != 'check'
        run: |
          docker --version
          aws --version
      - name: Run the selected operation
        env:
          BACKUP_MODE: ${{ github.event_name == 'schedule' && 'backup' || inputs.mode }}
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          S3_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
          BACKUP_PREFIX: ${{ vars.BACKUP_PREFIX || 'votebot/postgres/' }}
          BACKUP_KEEP_COUNT: ${{ vars.BACKUP_KEEP_COUNT || '7' }}
          BACKUP_PRUNE_ENABLED: ${{ vars.BACKUP_PRUNE_ENABLED || 'false' }}
          BACKUP_USE_DOCKER: 'true'
          BACKUP_VERIFY_KEY: ${{ inputs.object_key }}
        run: node scripts/backup.cjs "--$BACKUP_MODE"
